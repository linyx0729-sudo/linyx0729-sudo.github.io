<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linyx | Personal Homepage</title>
    <meta
      name="description"
      content="Linyx 的个人主页，汇集 GitHub 资料、联系方式和个人展示入口。"
    />
    <meta property="og:title" content="Linyx | Personal Homepage" />
    <meta
      property="og:description"
      content="欢迎来到 Linyx 的个人主页。"
    />
    <meta
      property="og:image"
      content="https://avatars.githubusercontent.com/u/266084118?v=4"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="intro-title">
        <div class="profile">
          <img
            class="avatar"
            src="https://avatars.githubusercontent.com/u/266084118?v=4"
            alt="Linyx 的 GitHub 头像"
            width="128"
            height="128"
          />
          <div>
            <p class="eyebrow">Personal Homepage</p>
            <h1 id="intro-title">你好，我是 Linyx。</h1>
            <p class="lead">
              这里是我的个人主页。后续我会把项目、笔记和作品慢慢整理到这里。
            </p>
          </div>
        </div>

        <div class="actions" aria-label="主要链接">
          <a class="button primary" href="https://github.com/linyx0729-sudo">
            访问 GitHub
          </a>
          <a class="button" href="https://github.com/linyx0729-sudo?tab=repositories">
            查看项目
          </a>
        </div>
      </section>

      <section class="grid" aria-label="主页内容">
        <article class="panel accent-a">
          <p class="kicker">Now</p>
          <h2>正在建设中</h2>
          <p>
            这个页面会作为一个长期更新的入口，用来展示公开项目、学习记录和可分享的成果。
          </p>
        </article>

        <article class="panel accent-b">
          <p class="kicker">GitHub</p>
          <h2>@linyx0729-sudo</h2>
          <p>
            你可以通过 GitHub 了解我的代码仓库和后续更新。
          </p>
        </article>

        <article class="panel accent-c">
          <p class="kicker">Contact</p>
          <h2>保持连接</h2>
          <p>
            如果你想补充邮箱、社交媒体或作品链接，可以直接更新这个主页。
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
